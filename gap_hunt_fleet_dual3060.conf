# GAP_HUNT fleet for the dual-RTX-3060 box — one walker per GPU.
# Usage: CONF=gap_hunt_fleet_dual3060.conf scripts/gap_hunt_fleet.sh
#
# N3 dataset: first-ever gap distribution at 10^229-10^383 (min-merit 8).
# Each walker owns one full GPU (device 0 / device 1).
# Gap rates MEASURED 2026-09-20 on the devbox 3070 at min-merit 10 with lex
# covers, 10-minute arms: shift507 ~123,500 gaps/h, shift1017 ~50,000 gaps/h.
# (The older "~400-500 exact gaps/hour per 3060" note was ~100x off at
# min-merit 10 and is superseded - it must have referred to a higher threshold.)
# With the corrected model's gaps/record (shift1017 1.361e6, shift507 1.075e7)
# that is ~27 h/record at shift1017 (one 3070) and ~87 h at shift507.
data/crt/m23/shift1017_p130_strong_m30.txt  0   10
data/crt/m23/shift1017_p130_lex_m30.txt  1   10

# Record hunt (optional; only when a GPU is free — do not stack on a
